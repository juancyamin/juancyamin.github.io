<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Juan C. Yamin — sharing image</title>
  <!-- Render at 1200 × 630 pixels to regenerate images/juan-yamin-share.jpg.
       This source directory is excluded from the published Jekyll site. -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #f8f9fa; color: #202833; font-family: Arial, sans-serif; }
    main { position: relative; width: 100%; height: 100%; padding: 80px; }
    .copy { position: absolute; top: 175px; left: 80px; width: 680px; }
    .label { margin: 0 0 22px; color: #2b587a; font-size: 20px; font-weight: 700; letter-spacing: 3px; }
    h1 { margin: 0 0 26px; font: 64px/1.05 Georgia, serif; }
    .description { margin: 0; color: #5d6975; font-size: 26px; line-height: 1.5; }
    .url { position: absolute; bottom: 76px; left: 80px; margin: 0; color: #2b587a; font-size: 22px; }
    figure { position: absolute; top: 147px; right: 80px; width: 280px; margin: 0; }
    .portrait { width: 280px; height: 336px; overflow: hidden; border-radius: 12px; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 16%; transform: scale(1.55); }
    figcaption { margin-top: 7px; text-align: center; color: #747b82; font-size: 8px; }
  </style>
</head>
<body>
  <main>
    <div class="copy">
      <p class="label">ECONOMETRICS</p>
      <h1>Juan C. Yamin</h1>
      <p class="description">Ph.D. candidate in Economics<br>Brown University</p>
    </div>
    <figure>
      <div class="portrait"><img src="../images/juan-yamin-2026.png" alt="Juan C. Yamin"></div>
      <figcaption>Photo by Carolina Flórez</figcaption>
    </figure>
    <p class="url">juancyamin.github.io</p>
  </main>
</body>
</html>
